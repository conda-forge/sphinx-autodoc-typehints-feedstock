schema_version: 1

context:
  python_min: '3.12'
  version: 3.17.1

package:
  name: sphinx-autodoc-typehints
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sphinx-autodoc-typehints/sphinx_autodoc_typehints-${{ version }}.tar.gz
  sha256: 1921a9c2418b4ccd2d06c5aee4215af622455575f7a969d31cfdb96fa5db6e01

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
    - pip
  run:
    - python >=${{ python_min }}
    - sphinx >=9.1
    - typing_extensions >=4.16
tests:
  - python:
      imports:
        - sphinx_autodoc_typehints
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Type hints (PEP 484) support for the Sphinx autodoc extension
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tox-dev/sphinx-autodoc-typehints
  repository: https://github.com/tox-dev/sphinx-autodoc-typehints

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
